services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socx
      POSTGRES_USER: socx
      POSTGRES_PASSWORD: socxpass
    ports: ["5432:5432"]
    volumes: [socx_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socx -d socx"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://socx:socxpass@db:5432/socx
      FRONTEND_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  socx_pgdata:
